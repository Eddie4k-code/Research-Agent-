[project]
name = "research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eddie4k-code", email = "eddie4k1080@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "dotenv>=0.9.9",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.1",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.14",
    "langgraph-cli[inmem]>=0.4.33",
]

[project.scripts]
research-agent = "research_agent:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
